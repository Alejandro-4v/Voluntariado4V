name: "Intermodular"

networks:
  api:
    driver: bridge

services:
  php:
    build: ./docker/images/php
    container_name: php
    ports:
      - "8080:80"
      - "8000:8000"
      - "9003:9003"
    volumes:
      - ./api:/api
      - ./db_scripts:/api/db_scripts
    depends_on:
      - mysql
    profiles:
      - "api"
    networks:
      - api
    working_dir: /api
    stdin_open: true
    tty: true

  mysql:
    image: mysql:8.1
    container_name: mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: API
      MYSQL_USER: api
      MYSQL_PASSWORD: api123
    profiles:
      - "api"
    networks:
      - api

  angular:
    build: ./docker/images/angular
    container_name: angular
    ports:
      - "4200:4200"
    volumes:
      - ./Angular/WebVoluntariado:/app
      - /app/node_modules
      - /app/.angular
    depends_on:
      - php
    profiles:
      - "api"
    networks:
      - api
    working_dir: /app
    stdin_open: true
    tty: true
