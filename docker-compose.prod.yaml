version: '3.8'

services:
  php:
    build:
      context: ./api
      dockerfile: ../docker/images/php/Dockerfile.prod
    container_name: php_prod
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      # For local testing, we still connect to the local MySQL container
      # In AWS, these env vars will be overridden by Elastic Beanstalk configuration
      DATABASE_URL: mysql://root:root@mysql:3306/API?serverVersion=8.1.0&charset=utf8mb4
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
    ports:
      - "8000:80"
    depends_on:
      - mysql
    networks:
      - app-network

  angular:
    build:
      context: ./Angular/WebVoluntariado
      dockerfile: ../../docker/images/angular/Dockerfile.prod
    container_name: angular_prod
    ports:
      - "80:80"
    depends_on:
      - php
    networks:
      - app-network

  mysql:
    image: mysql:8.1
    container_name: mysql_prod
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: API
    ports:
      - "3306:3306"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
